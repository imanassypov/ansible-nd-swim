---
# Example Ansible playbook to deploy a server. This playbook can be used as a template for deploying various types of servers by customizing the tasks and variables as needed.
- name: Deploy Web Server
  hosts: webservers
  become: true
  vars:
    http_port: 80
    max_clients: 200

  tasks:
    - name: Install Apache Web Server
      apt:
        name: apache2
        state: present
      when: ansible_os_family == "Debian"

    - name: Install Apache Web Server
      yum:
        name: httpd
        state: present
      when: ansible_os_family == "RedHat"

    - name: Ensure Apache is running and enabled on boot
      service:
        name: "{{ 'apache2' if ansible_os_family == 'Debian' else 'httpd' }}"
        state: started
        enabled: true

    - name: Configure Apache to listen on the specified port
      lineinfile:
