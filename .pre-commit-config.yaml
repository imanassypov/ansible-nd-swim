---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/ansible/ansible-lint
    rev: v24.7.0
    hooks:
      - id: ansible-lint
        language_version: python3.12
        # TODO: Update path if your playbooks are in a non-standard location
        # This regex ensures only YAML files inside the 'data/' folder are linted
        files: ^data/.*\.(ya?ml)$
        additional_dependencies:
          - ansible-core==2.17.5
          - ansible-compat>=1.0.0

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff replaces black, isort, and flake8 for faster Python linting
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml] # Ensure you have a .yamllint.yaml or remove this arg
